<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- SoftPlay: ícono estilo terminal (solo trazos; sin <text> para que Godot lo importe bien) -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#15192B"/>
  <rect x="8" y="8" width="112" height="112" rx="22" fill="none" stroke="#2A3350" stroke-width="3"/>
  <!-- barra de título -->
  <circle cx="24" cy="24" r="5" fill="#FF5F57"/>
  <circle cx="40" cy="24" r="5" fill="#FEBC2E"/>
  <circle cx="56" cy="24" r="5" fill="#28C840"/>
  <!-- prompt ">" verde -->
  <path d="M28 50 L58 72 L28 94" fill="none" stroke="#4ADE80" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- cursor naranja -->
  <rect x="70" y="56" width="22" height="34" rx="4" fill="#F97316"/>
  <!-- subrayado azul "play" -->
  <rect x="70" y="96" width="34" height="7" rx="3.5" fill="#2F55E6"/>
</svg>
